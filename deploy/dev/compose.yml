# Dev server deployment (.github/workflows/deploy-dev.yml): the image built from
# deploy/Dockerfile, migrations then the API. The workflow writes .env next to
# this file (docker compose reads it for ${IMAGE_TAG} and env_file).
# The project name is fixed: it used to come from the checkout folder
# ("justixauto"), and a different name would clash with the running
# container_name "justix-auto" instead of recreating it.
name: justixauto
services:
  api:
    image: poirot92/justix-auto:${IMAGE_TAG}
    container_name: justix-auto
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "2047:8080"

    networks:
      - justix-db

  migrate:
    image: poirot92/justix-auto:${IMAGE_TAG}

    env_file:
      - .env

    entrypoint:
      - /app/migrate

    command:
      - up

    networks:
      - justix-db

  # One-time reset of the pre-ADR-14 schema layout; see reset-old-layout.sql.
  # The profile keeps it out of `docker compose up`.
  reset-old-layout:
    image: docker.io/library/postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    profiles:
      - one-off
    env_file:
      - .env
    entrypoint:
      - sh
      - -c
      - exec psql "$$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f /reset-old-layout.sql
    volumes:
      - ./reset-old-layout.sql:/reset-old-layout.sql:ro
    networks:
      - justix-db

  bootstrap-admin:
    image: poirot92/justix-auto:${IMAGE_TAG}
    profiles:
      - bootstrap
    stdin_open: true
    tty: false
    restart: "no"

    environment:
      DATABASE_URL: ${DATABASE_URL}

    entrypoint:
      - /app/bootstrap-admin

    networks:
      - justix-db

networks:
  justix-db:
    external: true
