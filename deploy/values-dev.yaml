# Dev server environment (shared, non-production). Fill the REPLACE placeholders
# before the first rollout; any rollout is an explicit human decision (AGENTS.md).
environment: dev
image:
  repository: poirot92/justix-auto  # built by .github/workflows/deploy-dev.yml
  tag: ""                           # the Git SHA the dev pipeline pushed, or set the digest
  digest: ""
replicaCount: 2
config:
  cookieSecure: true                # served over HTTPS through the ingress
  s3:
    bucket: REPLACE-justixauto-documents-dev
    region: eu-central-1
  otel:
    endpoint: ""                    # set when the cluster runs an OpenTelemetry Collector
    traceSampleRatio: "0.5"
resources:
  requests: { cpu: 50m, memory: 96Mi }
  limits: { memory: 256Mi }
ingress:
  enabled: true
  className: nginx
  host: dev.example.com
  tls:
    - secretName: justixauto-dev-tls
      hosts: [dev.example.com]
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: REPLACE-arn:aws:iam::ACCOUNT:role/justixauto-dev-s3
