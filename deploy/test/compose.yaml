# Throwaway PostgreSQL and MinIO for `make test-go` (started with --wait, removed
# with down -v afterwards). Loopback only; the credentials are test-only and the
# Makefile's TEST_DATABASE_URL / TEST_S3_ENDPOINT use these ports.
name: justixauto-test
services:
  postgres:
    image: docker.io/library/postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: justixauto_test
      POSTGRES_PASSWORD: justixtest
    ports:
      - "127.0.0.1:55442:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "justixauto_test", "-h", "127.0.0.1"]
      interval: 1s
      timeout: 3s
      retries: 60
  # MinIO's own images were withdrawn from quay.io and Docker Hub (pulls are denied),
  # so this is the still-public Bitnami archive build (MinIO 2025.5.24); it reads the
  # same MINIO_ROOT_* credentials and ships mc for the health check.
  minio:
    image: docker.io/bitnamilegacy/minio:latest@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    environment:
      MINIO_ROOT_USER: justixtest
      MINIO_ROOT_PASSWORD: justixtest-secret
    ports:
      - "127.0.0.1:59010:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 3s
      retries: 60
