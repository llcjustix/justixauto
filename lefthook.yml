# Local development checks are unit tests only (user decision 2026-09-26).
# Run the affected unit tests once in the main session. Hooks do not repeat
# them or run formatting, lint, typecheck, OpenAPI, builds or commit-message checks.
# CI/release checks remain configured separately in .github/workflows/.
pre-commit:
  jobs: []
commit-msg:
  jobs: []
pre-push:
  jobs: []
