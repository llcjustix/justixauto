name: DEV admin one-time operation

on:
  push:
    branches: [infra/dev-admin-once-20261016]
    paths:
      - .github/workflows/dev-admin-once-20261016.yml
      - cmd/dev-admin-once-20261016/main.go
      - deploy/dev/admin-once-20261016.Dockerfile

permissions:
  contents: read

concurrency:
  group: justix-auto-dev
  cancel-in-progress: false

jobs:
  seed:
    if: github.event_name == 'push' && github.ref == 'refs/heads/infra/dev-admin-once-20261016' && github.repository == 'llcjustix/justixauto'
    runs-on:
      group: jlearnx runner
      labels: [self-hosted, docker, jlearnx]
    timeout-minutes: 10
    env:
      PGHOST: ${{ secrets.JUSTIX_AUTO_DB_HOST }}
      PGPORT: ${{ secrets.JUSTIX_AUTO_DB_PORT }}
      PGDATABASE: ${{ secrets.JUSTIX_AUTO_DB_NAME }}
      PGUSER: ${{ secrets.JUSTIX_AUTO_DB_USER }}
      PGPASSWORD: ${{ secrets.JUSTIX_AUTO_DB_PASSWORD }}
      PGSSLMODE: disable
      PGCONNECT_TIMEOUT: '10'
      PSQL_IMAGE: docker.io/library/postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    steps:
      - name: Checkout operation source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: false

      - name: Capture private operation source
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          run_id="${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}"
          temp_dir="${RUNNER_TEMP:?}/justix-auto-admin-once-${run_id}"
          mkdir -p "$temp_dir"
          chmod 700 "$temp_dir"
          password="$(sed -n 's/^[[:space:]]*adminPassword = "\(.*\)"$/\1/p' cmd/dev-admin-once-20261016/main.go)"
          test -n "$password"
          echo "::add-mask::$password"
          cp cmd/dev-admin-once-20261016/main.go "$temp_dir/main.go"
          cp deploy/dev/admin-once-20261016.Dockerfile "$temp_dir/Dockerfile"
          chmod 600 "$temp_dir/main.go" "$temp_dir/Dockerfile"
          printf 'temp_dir=%s\n' "$temp_dir" >> "$GITHUB_OUTPUT"

      - name: Inspect only target metadata
        id: target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(docker context show)" == default ]] || { echo 'docker context rejected'; exit 1; }
          run_id="${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}"
          client="justix-auto-admin-once-client-${run_id}"
          target="$(docker inspect --format '{{.State.Running}}|{{.Config.Image}}|{{.Image}}|{{index .Config.Labels "com.docker.compose.project"}}|{{index .Config.Labels "com.docker.compose.service"}}|{{range $k, $_ := .NetworkSettings.Networks}}{{$k}},{{end}}' justix-auto 2>/dev/null)" || { echo 'target inspection failed'; exit 1; }
          IFS='|' read -r running image image_id project service networks <<< "$target"
          [[ "$running" == true && "$project" == justixauto && "$service" == api && "$image" =~ ^poirot92/justix-auto:[0-9a-f]{40}$ && "$image_id" =~ ^sha256:[0-9a-f]{64}$ && ",$networks" == *,justix-db,* ]] || { echo 'target metadata rejected'; exit 1; }
          target_ip="$(docker inspect --format '{{with index .NetworkSettings.Networks "justix-db"}}{{.IPAddress}}{{end}}' justix-auto 2>/dev/null)" || { echo 'target network inspection failed'; exit 1; }
          IFS=. read -r ip1 ip2 ip3 ip4 <<< "$target_ip"
          [[ "$ip1" =~ ^[0-9]+$ && "$ip2" =~ ^[0-9]+$ && "$ip3" =~ ^[0-9]+$ && "$ip4" =~ ^[0-9]+$ ]] && ((ip1 <= 255 && ip2 <= 255 && ip3 <= 255 && ip4 <= 255)) || { echo 'target IP rejected'; exit 1; }
          db_network="$(docker network inspect --format '{{.Name}}|{{.Driver}}|{{.Scope}}' justix-db 2>/dev/null)" || { echo 'database network inspection failed'; exit 1; }
          [[ "$db_network" == justix-db\|* ]] || { echo 'database network rejected'; exit 1; }
          echo "target=running image=${image} image_id=${image_id} project=${project} service=${service} networks=${networks} database_network=${db_network}"
          printf 'image_id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"
          printf 'image=%s\ntarget_ip=%s\n' "$image" "$target_ip" >> "$GITHUB_OUTPUT"
          printf 'client=%s\n' "$client" >> "$GITHUB_OUTPUT"

      - name: Read-only schema preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          readonly_sql="BEGIN READ ONLY; SET LOCAL statement_timeout = '15s'; SET LOCAL lock_timeout = '5s'; WITH req(col) AS (VALUES ('id'),('display_name'),('email'),('login'),('password_hash'),('password_change_required'),('status'),('status_reason'),('failed_logins'),('locked_until'),('version'),('created_at'),('updated_at')), shapes(layout,schema_name,users_name,roles_name,user_roles_name,audit_name) AS (VALUES ('legacy','identity','users','roles','user_roles','audit_events'),('flat','public','identity_users','identity_roles','identity_user_roles','identity_audit_events')), presence AS (SELECT s.layout, (SELECT count(*) FROM information_schema.tables t WHERE t.table_schema=s.schema_name AND t.table_name IN (s.users_name,s.roles_name,s.user_roles_name,s.audit_name)) tables_present FROM shapes s), valid AS (SELECT s.layout FROM shapes s WHERE (SELECT count(*) FROM information_schema.columns c JOIN req r ON r.col=c.column_name WHERE c.table_schema=s.schema_name AND c.table_name=s.users_name)=13 AND (SELECT count(*) FROM information_schema.columns c WHERE c.table_schema=s.schema_name AND c.table_name=s.roles_name AND c.column_name IN ('id','system_key','scope','deleted_at'))=4 AND (SELECT count(*) FROM information_schema.columns c WHERE c.table_schema=s.schema_name AND c.table_name=s.user_roles_name AND c.column_name IN ('user_id','role_id'))=2 AND (SELECT count(*) FROM information_schema.columns c WHERE c.table_schema=s.schema_name AND c.table_name=s.audit_name AND c.column_name IN ('id','seq','occurred_at','actor_user_id','action','resource_type','resource_id','company_id','reason','details'))=10), migration AS (SELECT version::text version, dirty::text dirty FROM public.schema_migrations), binding AS (SELECT EXISTS (SELECT 1 FROM pg_stat_activity WHERE backend_type='client backend' AND client_addr='${{ steps.target.outputs.target_ip }}'::inet AND datname=current_database() AND usename=current_user)::text bound) SELECT CASE WHEN (SELECT count(*) FROM valid)=1 AND (SELECT count(*) FROM migration)=1 AND (SELECT dirty FROM migration)='false' AND (SELECT tables_present FROM presence WHERE layout <> (SELECT layout FROM valid))=0 THEN (SELECT layout FROM valid) ELSE 'invalid' END || '|' || COALESCE((SELECT version FROM migration),'missing') || '|' || COALESCE((SELECT dirty FROM migration),'missing') || '|' || (SELECT bound FROM binding); COMMIT;"
          result="$(docker run --rm --name "${{ steps.target.outputs.client }}" --network justix-db --read-only --cap-drop ALL --security-opt no-new-privileges --memory 128m --cpus 0.5 --pids-limit 32 --entrypoint psql -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD -e PGSSLMODE -e PGCONNECT_TIMEOUT "$PSQL_IMAGE" -X -v ON_ERROR_STOP=1 -qAt -c "$readonly_sql" 2>/dev/null)" || { echo 'schema preflight failed'; exit 1; }
          IFS='|' read -r layout version dirty binding <<< "$result"
          [[ "$layout" == legacy || "$layout" == flat ]] && [[ "$version" =~ ^[0-9]+$ && "$dirty" == false && "$binding" == true ]] || { echo 'schema preflight rejected'; exit 1; }
          if [[ "$layout" == legacy ]]; then
            source_sha=3cc124c5a5858a5eaa2991edafc2771ee7232966
            identity_sql="BEGIN READ ONLY; SET LOCAL statement_timeout = '15s'; SET LOCAL lock_timeout = '5s'; SELECT EXISTS (SELECT 1 FROM identity.roles WHERE id='00000000-0000-4000-8000-000000000001' AND system_key='platform_admin' AND scope='platform' AND deleted_at IS NULL)::text || '|' || (SELECT count(*) FROM identity.users u JOIN identity.user_roles ur ON ur.user_id=u.id WHERE u.status='active' AND ur.role_id='00000000-0000-4000-8000-000000000001')::text; COMMIT;"
          else
            source_sha=96698c1ba6c4ef73cf73c17a8ff0464373e84840
            identity_sql="BEGIN READ ONLY; SET LOCAL statement_timeout = '15s'; SET LOCAL lock_timeout = '5s'; SELECT EXISTS (SELECT 1 FROM public.identity_roles WHERE id='00000000-0000-4000-8000-000000000001' AND system_key='platform_admin' AND scope='platform' AND deleted_at IS NULL)::text || '|' || (SELECT count(*) FROM public.identity_users u JOIN public.identity_user_roles ur ON ur.user_id=u.id WHERE u.status='active' AND ur.role_id='00000000-0000-4000-8000-000000000001')::text; COMMIT;"
          fi
          if [[ "$layout" == legacy ]]; then [[ '${{ steps.target.outputs.image }}' == poirot92/justix-auto:3cc124c5a5858a5eaa2991edafc2771ee7232966 ]] || { echo 'image layout rejected'; exit 1; }; else [[ '${{ steps.target.outputs.image }}' == poirot92/justix-auto:4fa683ba4708bb71031534260ec5cb8742ce9977 || '${{ steps.target.outputs.image }}' == poirot92/justix-auto:96698c1ba6c4ef73cf73c17a8ff0464373e84840 ]] || { echo 'image layout rejected'; exit 1; }; fi
          identity_result="$(docker run --rm --name "${{ steps.target.outputs.client }}" --network justix-db --read-only --cap-drop ALL --security-opt no-new-privileges --memory 128m --cpus 0.5 --pids-limit 32 --entrypoint psql -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD -e PGSSLMODE -e PGCONNECT_TIMEOUT "$PSQL_IMAGE" -X -v ON_ERROR_STOP=1 -qAt -c "$identity_sql" 2>/dev/null)" || { echo 'identity preflight failed'; exit 1; }
          IFS='|' read -r role_ok active_admins <<< "$identity_result"
          [[ "$role_ok" == true && "$active_admins" =~ ^[0-9]+$ ]] || { echo 'identity preflight rejected'; exit 1; }
          echo "preflight layout=${layout} active_admins=${active_admins} migration_version=${version} dirty=${dirty} target_binding=${binding} source=${source_sha}"
          printf 'layout=%s\nactive_admins=%s\nsource_sha=%s\n' "$layout" "$active_admins" "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout matched helper source
        if: steps.preflight.outputs.active_admins == '0'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.preflight.outputs.source_sha }}
          persist-credentials: false
          clean: false

      - name: Restore operation source and build
        if: steps.preflight.outputs.active_admins == '0'
        id: build
        shell: bash
        run: |
          set -euo pipefail
          temp_dir='${{ steps.capture.outputs.temp_dir }}'
          test "$(git rev-parse HEAD)" = '${{ steps.preflight.outputs.source_sha }}'
          mkdir -p cmd/dev-admin-once-20261016 deploy/dev
          cp "$temp_dir/main.go" cmd/dev-admin-once-20261016/main.go
          cp "$temp_dir/Dockerfile" deploy/dev/admin-once-20261016.Dockerfile
          test "$(sha256sum "$temp_dir/main.go" | awk '{print $1}')" = "$(sha256sum cmd/dev-admin-once-20261016/main.go | awk '{print $1}')"
          test "$(sha256sum "$temp_dir/Dockerfile" | awk '{print $1}')" = "$(sha256sum deploy/dev/admin-once-20261016.Dockerfile | awk '{print $1}')"
          image="justix-auto-admin-once:${GITHUB_SHA:?}"
          { git ls-files -z -- go.mod go.sum internal; printf '%s\0' cmd/dev-admin-once-20261016 deploy/dev/admin-once-20261016.Dockerfile; } | tar --null -T - -cf - | docker build -f deploy/dev/admin-once-20261016.Dockerfile --label com.justix.operation=dev-admin-once-20261016 -t "$image" -
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"

      - name: Seed only after immutable image recheck
        if: steps.preflight.outputs.active_admins == '0'
        id: seed
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(docker context show)" == default ]] || { echo 'docker context drifted'; exit 1; }
          current_id="$(docker inspect --format '{{.Image}}' justix-auto 2>/dev/null)" || { echo 'target recheck failed'; exit 1; }
          [[ "$current_id" == '${{ steps.target.outputs.image_id }}' ]] || { echo 'target image drifted'; exit 1; }
          current_image="$(docker inspect --format '{{.Config.Image}}' justix-auto 2>/dev/null)" || { echo 'target image reference recheck failed'; exit 1; }
          [[ "$current_image" == '${{ steps.target.outputs.image }}' ]] || { echo 'target image reference drifted'; exit 1; }
          current_ip="$(docker inspect --format '{{with index .NetworkSettings.Networks "justix-db"}}{{.IPAddress}}{{end}}' justix-auto 2>/dev/null)" || { echo 'target network recheck failed'; exit 1; }
          [[ "$current_ip" == '${{ steps.target.outputs.target_ip }}' ]] || { echo 'target IP drifted'; exit 1; }
          set +e
          result="$(docker run --rm --name "justix-auto-admin-once-seed-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}" --network justix-db --read-only --cap-drop ALL --security-opt no-new-privileges --memory 256m --cpus 1 --pids-limit 64 -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD -e PGSSLMODE -e PGCONNECT_TIMEOUT -e OPERATION_SOURCE_SHA='${{ steps.preflight.outputs.source_sha }}' '${{ steps.build.outputs.image }}' 2>/dev/null)"
          run_status=$?
          set -e
          if (( run_status != 0 )); then [[ "$result" =~ ^outcome=failed\ stage=[a-z0-9_]+$ ]] && echo "$result" || echo 'seed failed'; exit 1; fi
          [[ "$result" == outcome=created || "$result" == 'outcome=skip code=already_bootstrapped' ]] || { echo 'seed result rejected'; exit 1; }
          echo "$result"
          printf 'result=%s\n' "$result" >> "$GITHUB_OUTPUT"

      - name: Cleanup one-time operation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          run_id="${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}"
          for container in "justix-auto-admin-once-client-${run_id}" "justix-auto-admin-once-seed-${run_id}"; do
            if docker container inspect "$container" >/dev/null 2>&1; then docker rm -f "$container" >/dev/null; fi
          done
          image="justix-auto-admin-once:${GITHUB_SHA:?}"
          if docker image inspect "$image" >/dev/null 2>&1; then docker image rm "$image" >/dev/null; fi
          rm -rf "${RUNNER_TEMP:?}/justix-auto-admin-once-${run_id}"
          rm -f cmd/dev-admin-once-20261016/main.go deploy/dev/admin-once-20261016.Dockerfile
          echo 'cleanup completed'
